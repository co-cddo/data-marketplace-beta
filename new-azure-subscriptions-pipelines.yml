trigger:
  branches:
    include:
      - master

pool:
  name: Azure Pipelines
  vmImage: 'windows-latest'

stages:

# Pre-Deployment Stage (Build)
- stage: Pre_Deployment
  displayName: 'Build Stage'
  jobs:
    - job: Build
      displayName: 'Build Web App'
      steps:
        - checkout: self
        - task: UseDotNet@2
          displayName: 'Install .NET SDK'
          inputs:
            packageType: 'sdk'
            version: '8.0.x'
            installationPath: $(Agent.ToolsDirectory)/dotnet
        
        # Prepare SonarCloud Analysis
        - task: SonarCloudPrepare@3
          inputs:
            SonarCloud: '$(SONARCLOUD_SERVICE_CONNECTION)'
            organization: '$(SONARCLOUD_ORGANIZATION)'
            projectKey: '$(SONARCLOUD_PROJECT_KEY)'
            projectName: '$(SONARCLOUD_PROJECT_NAME)'
            scannerMode: 'dotnet'
            extraProperties: |
              sonar.cs.opencover.reportsPaths=$(Agent.TempDirectory)/**/coverage.opencover.xml

        # Authenticate to Azure Artifacts Feed
        - task: NuGetAuthenticate@1
          displayName: 'Authenticate to AGM Azure Artifacts Feed'

        # Restore .NET packages from private and public feeds
        - script: |
            dotnet restore --source https://pkgs.dev.azure.com/agrimetrics-projects/_packaging/agm-intellectual-property/nuget/v3/index.json --source https://api.nuget.org/v3/index.json
          displayName: 'Restore .NET packages'
          
                  # Restore Dependencies
        - task: DotNetCoreCLI@2
          displayName: 'Restore Dependencies'
          inputs:
            command: 'restore'
            projects: '**/*.csproj'  # Restore only for .csproj files

        - task: DotNetCoreCLI@2
          displayName: 'Build Solution'
          inputs:
            command: 'build'
            arguments: '--configuration Release'

        # Run Tests and Collect Code Coverage
        - task: DotNetCoreCLI@2
          displayName: 'Run Tests with Code Coverage'
          inputs:
            command: 'test'
            arguments: '--settings opencover.runsettings --configuration Release --collect:"XPlat Code Coverage"'
            publishTestResults: true
        
        - task: PublishCodeCoverageResults@2
          displayName: 'Publish Code Coverage Results'
          inputs:
            summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.opencover.xml'

        # Run SonarCloud Analysis
        - task: SonarCloudAnalyze@3

        # Publish Quality Gate Result
        - task: SonarCloudPublish@3
          inputs:
            pollingTimeoutSec: '300'

        - task: DotNetCoreCLI@2
          displayName: 'Publish Web App'
          inputs:
            command: 'publish'
            publishWebProjects: true
            arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory) --runtime win-x64 --self-contained false'
            zipAfterPublish: true
            
        - task: PublishBuildArtifacts@1
          displayName: 'Publish Build Artifacts'
          inputs:
            PathtoPublish: '$(Build.ArtifactStagingDirectory)'
            ArtifactName: 'webapp'
            publishLocation: 'Container'

# DEV Environment Deployment
- stage: DEV_Environment_Deployment
  dependsOn: Pre_Deployment
  condition: succeeded()
  displayName: 'Deploy to DEV Environment'
  jobs:
    - deployment: DeployToDev
      environment: 'CDDO DEV UI'
      strategy:
        runOnce:
          deploy:
            steps:
              - download: current
                artifact: webapp
              - task: AzureRmWebAppDeployment@4
                displayName: 'Deploy to DEV Web App'
                inputs:
                  ConnectionType: 'AzureRM'
                  azureSubscription: 'CDDO Dev Deployment'
                  appType: 'webApp'
                  WebAppName: 'azapp-cddowebui-dev-001'
                  ResourceGroupName: 'rg-webapp-agri-cbo-dev-uksouth-01'
                  package: '$(Pipeline.Workspace)/webapp/**/*.zip'

