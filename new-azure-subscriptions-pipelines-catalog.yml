# CI disabled intentionally — do not re-enable without team consensus
trigger: none
pr: none

pool:
  name: Azure Pipelines
  vmImage: 'windows-latest'

stages:

# Pre-Deployment Stage (Build)
- stage: Pre_Deployment
  displayName: 'Build Stage'
  jobs:
    - job: Build
      displayName: 'Build CDDO Catalog API'
      steps:
        - checkout: self
        - task: UseDotNet@2
          displayName: 'Install .NET SDK'
          inputs:
            packageType: 'sdk'
            version: '8.0.x'
            installationPath: $(Agent.ToolsDirectory)/dotnet

        # Authenticate to Azure Artifacts Feed
        - task: NuGetAuthenticate@1
          displayName: 'Authenticate to AGM Azure Artifacts Feed'

        # Restore dependencies
        - task: DotNetCoreCLI@2
          displayName: 'Restore Dependencies'
          inputs:
            command: 'restore'
            projects: 'Cddo.Data.Marketplace.Api/Cddo.Data.Marketplace.Api.csproj'
            feedsToUse: 'select'
            vstsFeed: 'agm-intellectual-property'

        # Build the API
        - task: DotNetCoreCLI@2
          displayName: 'Build CDDO Catalog API'
          inputs:
            command: 'build'
            projects: 'Cddo.Data.Marketplace.Api/Cddo.Data.Marketplace.Api.csproj'
            arguments: '--configuration Release'

        # Publish the API
        - task: DotNetCoreCLI@2
          displayName: 'Publish CDDO Catalog API'
          inputs:
            command: 'publish'
            publishWebProjects: false
            modifyOutputPath: false
            workingDirectory: 'Cddo.Data.Marketplace.Api'
            arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory) --runtime win-x64 --self-contained false'

        # Publish build artifacts
        - task: PublishBuildArtifacts@1
          displayName: 'Publish Build Artifacts'
          inputs:
            PathtoPublish: '$(Build.ArtifactStagingDirectory)'
            ArtifactName: 'api'
            publishLocation: 'Container'

# DEV Environment Deployment
- stage: DEV_Environment_Deployment
  dependsOn: Pre_Deployment
  condition: succeeded()
  displayName: 'Deploy to DEV Environment'
  jobs:
    - deployment: DeployToDev
      environment: 'CDDO DEV Catalog API'
      strategy:
        runOnce:
          deploy:
            steps:
              - download: current
                artifact: api
              - task: AzureRmWebAppDeployment@4
                displayName: 'Deploy to DEV CDDO Catalog API'
                inputs:
                  ConnectionType: 'AzureRM'
                  azureSubscription: $(AZURE_SUBSCRIPTION_DEV)
                  appType: 'webApp'
                  WebAppName: $(DEV_WEBAPP_NAME)
                  ResourceGroupName: $(DEV_RESOURCE_GROUP)
                  package: '$(Pipeline.Workspace)/api/**/*.zip'

# TEST Environment Deployment
- stage: TEST_Environment_Deployment
  dependsOn: DEV_Environment_Deployment
  condition: succeeded()
  displayName: 'Deploy to TEST Environment'
  jobs:
    - deployment: DeployToTest
      environment: 'CDDO TEST Catalog API'
      strategy:
        runOnce:
          deploy:
            steps:
              - download: current
                artifact: api
              - task: AzureRmWebAppDeployment@4
                displayName: 'Deploy to TEST CDDO Catalog API'
                inputs:
                  ConnectionType: 'AzureRM'
                  azureSubscription: $(AZURE_SUBSCRIPTION_DEV)
                  appType: 'webApp'
                  WebAppName: $(TEST_WEBAPP_NAME)
                  ResourceGroupName: $(TEST_RESOURCE_GROUP)
                  package: '$(Pipeline.Workspace)/api/**/*.zip'

# PRODUCTION Environment Deployment - UK West
- stage: PROD_UK_WEST
  dependsOn: TEST_Environment_Deployment
  condition: succeeded()
  displayName: 'Deploy to PRODUCTION Environment - UK West'
  jobs:
    - deployment: DeployToProdUKWest
      environment: 'CDDO PROD Catalog API UK West'
      strategy:
        runOnce:
          deploy:
            steps:
              - download: current
                artifact: api
              - task: AzureRmWebAppDeployment@4
                displayName: 'Deploy to PROD CDDO Catalog API (UK West)'
                inputs:
                  ConnectionType: 'AzureRM'
                  azureSubscription: $(AZURE_SUBSCRIPTION_PROD)
                  appType: 'webApp'
                  WebAppName: $(PROD_UK_WEST_WEBAPP_NAME)
                  ResourceGroupName: $(PROD_UK_WEST_RESOURCE_GROUP)
                  package: '$(Pipeline.Workspace)/api/**/*.zip'

# PRODUCTION Environment Deployment - UK South
- stage: PROD_UK_SOUTH
  dependsOn: PROD_UK_WEST
  condition: succeeded()
  displayName: 'Deploy to PRODUCTION Environment - UK South'
  jobs:
    - deployment: DeployToProdUKSouth
      environment: 'CDDO PROD Catalog API UK South'
      strategy:
        runOnce:
          deploy:
            steps:
              - download: current
                artifact: api
              - task: AzureRmWebAppDeployment@4
                displayName: 'Deploy to PROD CDDO Catalog API (UK South)'
                inputs:
                  ConnectionType: 'AzureRM'
                  azureSubscription: $(AZURE_SUBSCRIPTION_PROD)
                  appType: 'webApp'
                  WebAppName: $(PROD_UK_SOUTH_WEBAPP_NAME)
                  ResourceGroupName: $(PROD_UK_SOUTH_RESOURCE_GROUP)
                  package: '$(Pipeline.Workspace)/api/**/*.zip'
